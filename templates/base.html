<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Facturador ARCA{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 0 1rem 4rem; }
    a { color: #2563eb; }
    h1 { font-size: 1.4rem; }
    nav.top { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; padding: 1rem 0; border-bottom: 1px solid #8884; margin-bottom: 1.5rem; font-size: .9rem; }
    nav.top .brand { font-weight: 700; font-size: 1.05rem; }
    nav.top .sep { margin-left: auto; }
    nav.top .who { color: #888; font-size: .85rem; }
    nav.top a { text-decoration: none; }
    button, .btn { display: inline-block; padding: .8rem 1.1rem; font-size: 1rem; border-radius: 8px; border: none; background: #2563eb; color: #fff; cursor: pointer; font-weight: 600; text-decoration: none; }
    button:disabled { opacity: .8; cursor: progress; }
    input[type=text], input[type=password], input[type=email], input[type=number], input[type=date], select, textarea {
      width: 100%; padding: .7rem; font-size: 1rem; border-radius: 8px; border: 1px solid #888; background: inherit; color: inherit; }
    label { display: block; font-weight: 600; margin: 1rem 0 .3rem; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .badge.prod { background: #bbf7d0; color: #166534; }
    .badge.homo { background: #fde68a; color: #92400e; }
    .ok { background: #dcfce7; color: #166534; padding: 1rem; border-radius: 10px; }
    .error { background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 10px; white-space: pre-wrap; }
    .muted { color: #888; font-size: .85rem; }
    .card { background: #1f2937; color: #e5e7eb; padding: 1rem; border-radius: 10px; }
    .spinner { display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -.2em; margin-right: .5em;
      border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: girar .7s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  {% if g.user %}
  <nav class="top">
    <span class="brand">🧾 Facturador ARCA</span>
    <a href="{{ url_for('facturar') }}">Facturar</a>
    <a href="{{ url_for('resumen') }}">Control monotributo</a>
    <a href="{{ url_for('historial') }}">Historial</a>
    <a href="{{ url_for('cuenta') }}">Mi cuenta</a>
    {% if g.user.role == 'admin' %}<a href="{{ url_for('admin_users') }}">Admin</a>{% endif %}
    <span class="sep who">👤 {{ g.user.email }}</span>
    <a href="{{ url_for('logout') }}">Salir</a>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
