{% extends "base.html" %}
{% block title %}Ingresar — Facturador ARCA{% endblock %}
{% block style %}
  .login-box { max-width: 360px; margin: 10vh auto 0; }
{% endblock %}
{% block content %}
<div class="login-box">
  <h1>🧾 Facturador ARCA</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autofocus required>
    <label for="password">Clave</label>
    <input type="password" id="password" name="password" required>
    <button type="submit" style="width:100%; margin-top:1.2rem">Entrar</button>
    {% if error %}<p class="error" style="margin-top:1rem">{{ error }}</p>{% endif %}
  </form>
</div>
{% endblock %}
