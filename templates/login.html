<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facturador ARCA — Ingresar</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 380px; margin: 12vh auto; padding: 0 1rem; }
    h1 { font-size: 1.3rem; }
    input, button { width: 100%; padding: .7rem; font-size: 1rem; box-sizing: border-box; border-radius: 8px; border: 1px solid #888; }
    button { margin-top: .8rem; background: #2563eb; color: #fff; border: none; cursor: pointer; }
    .error { color: #dc2626; margin-top: .6rem; }
  </style>
</head>
<body>
  <h1>🧾 Facturador ARCA</h1>
  <form method="post">
    <input type="password" name="password" placeholder="Clave" autofocus required>
    <button type="submit">Entrar</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
</body>
</html>
